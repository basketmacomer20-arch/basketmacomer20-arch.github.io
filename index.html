<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Referto Basket</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Referto">
<style>
:root{
  --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155; --txt:#e2e8f0; --mut:#94a3b8;
  --a:#3b82f6; --a2:#1d4ed8; --b:#f97316; --b2:#c2410c; --ok:#22c55e; --bad:#ef4444; --warn:#eab308;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:10px;background:var(--panel2);padding:10px 14px;touch-action:manipulation}
button:active{transform:scale(.97)}
button.pri{background:var(--a)} button.ok{background:var(--ok);color:#052e16} button.bad{background:var(--bad)} button.ghost{background:transparent;border:1px solid var(--line)}
input,select{font:inherit;color:var(--txt);background:#0b1222;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input[type=checkbox],input[type=radio]{width:22px;height:22px;accent-color:var(--a)}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:3px}
h1,h2,h3{margin:0 0 12px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--panel);border-radius:14px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top h1{flex:1;margin:0;font-size:22px}
.mut{color:var(--mut)} .sm{font-size:13px}
table.ed{width:100%;border-collapse:collapse}
table.ed th{font-size:12px;color:var(--mut);text-align:left;padding:4px;font-weight:600}
table.ed td{padding:3px 4px}
table.ed td.c{text-align:center}
.home-btns{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.home-btns button{padding:26px 18px;font-size:20px;text-align:left;border-radius:16px}
.home-btns button small{display:block;font-size:13px;color:var(--mut);margin-top:6px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--line)}
.badge.live{background:var(--ok);color:#052e16} .badge.end{background:var(--mut);color:#0f172a}
.list-item{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list-item .grow{flex:1;min-width:200px}
.cnt{font-size:13px;padding:3px 9px;border-radius:99px;background:var(--line)} .cnt.ok{background:var(--ok);color:#052e16} .cnt.bad{background:var(--bad)}

/* ---------- LIVE ---------- */
.live{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.sb{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;padding:6px 10px;background:#020617;border-bottom:1px solid var(--line)}
.tm{display:flex;flex-direction:column;gap:4px;padding:6px 12px;border-radius:12px;background:var(--panel)}
.tm.a{border-left:6px solid var(--a)} .tm.b{border-right:6px solid var(--b);text-align:right}
.tm .l1{display:flex;align-items:center;gap:12px}
.tm.b .l1{flex-direction:row-reverse}
.tn{font-weight:900;font-size:clamp(24px,2.6vw,36px);line-height:1.1;flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;text-transform:uppercase}
.sc{font-size:clamp(72px,7.6vw,116px);font-weight:900;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tm .l2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.tm.b .l2{justify-content:flex-end}
.tob{display:inline-flex;gap:3px} .tob i{width:12px;height:12px;border-radius:3px;border:2px solid var(--mut);display:inline-block} .tob i.u{background:var(--warn);border-color:var(--warn)}
.bonus{background:var(--bad);color:#fff;font-weight:800;padding:1px 8px;border-radius:6px}
.tfn{font-weight:700;color:var(--txt);font-size:15px}
.tm button{padding:6px 12px;font-size:14px}
.ctr{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:300px}
.per{font-size:13px;line-height:1.1;font-weight:700;color:var(--mut);letter-spacing:.08em}
.clk{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;padding:2px 18px;border-radius:12px;background:#1f0a0a;color:#fca5a5;cursor:pointer;user-select:none;border:2px solid #7f1d1d;min-width:200px;text-align:center}
.clk.run{background:#052e16;color:#86efac;border-color:#166534}
.cbtns{display:flex;gap:4px} .cbtns button{padding:4px 9px;font-size:13px}
.poss{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;width:100%;gap:0;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:#0b1222}
.poss button{border-radius:0;padding:2px 8px;font-size:40px;font-weight:900;line-height:1;background:transparent;color:#334155;display:flex;align-items:center;justify-content:center}
.poss button.on.a{background:var(--a);color:#fff} .poss button.on.b{background:var(--b);color:#fff}
.poss .pl3{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8px;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--mut);text-align:center;line-height:1.2}
.poss .pl3 b{font-size:13px;color:var(--txt);letter-spacing:0;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poss.none{border-color:var(--warn)} .poss.none .pl3{color:var(--warn)}
.crow{display:grid;grid-template-columns:1fr 88px;gap:6px;width:100%}
.sirenbtn{width:100%;padding:4px 6px;font-size:13px;line-height:1.25;font-weight:900;letter-spacing:.1em;background:#7f1d1d;color:#fecaca;border:2px solid #b91c1c;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
.sirenbtn.on{background:#ef4444;color:#fff;box-shadow:0 0 24px #ef4444}
.tobanner{position:relative;display:flex;align-items:center;justify-content:center;gap:24px;padding:8px 16px 12px;color:#fff;overflow:hidden}
.tobanner.t0{background:var(--a2)} .tobanner.t1{background:var(--b2)}
.tobanner .tolbl{display:flex;flex-direction:column;font-size:14px;font-weight:900;letter-spacing:.15em;line-height:1.2}
.tobanner .tolbl b{font-size:20px;letter-spacing:0}
.tobanner .tonum{font-size:64px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;min-width:110px;text-align:center}
.tobanner.warn .tonum{color:#fde047;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.tobanner button{background:rgba(0,0,0,.3);font-weight:700}
.tobanner .toprog{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.35)}
.tobanner .toprog i{display:block;height:100%;background:#fff;transition:width .1s linear}
.posstag{font-size:12px;font-weight:900;padding:2px 8px;border-radius:6px;color:#fff;letter-spacing:.05em}
.tm.a .posstag{background:var(--a)} .tm.b .posstag{background:var(--b)}
.tm.hasposs.a{box-shadow:inset 0 0 0 2px var(--a)} .tm.hasposs.b{box-shadow:inset 0 0 0 2px var(--b)}
.pl{flex:1;display:grid;grid-template-columns:1fr minmax(290px,340px) 1fr;gap:10px;padding:10px;min-height:0}
.roster{overflow:auto;min-height:0}
.rgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-items:start}
.rcol{display:flex;flex-direction:column;gap:5px;padding:5px;border-radius:12px}
.oncol{background:rgba(34,197,94,.08);border:2px solid rgba(34,197,94,.35)}
.benchcol{background:rgba(0,0,0,.2);border:2px dashed var(--line)}
.rhd{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--mut);display:flex;justify-content:space-between;padding:0 4px}
.oncol .rhd{color:#86efac}
.roster.a .oncol{order:2} /* in campo verso il centro per entrambe le squadre */
.rhd b.ok{color:var(--ok)} .rhd b.bad{color:var(--bad)}
.pbtn{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;padding:4px 10px;border:2px solid transparent;background:var(--panel);opacity:.6;min-height:54px;position:relative}
.pbtn.on{opacity:1;background:var(--panel2)}
.roster.a .pbtn.on{border-color:#1e3a8a} .roster.b .pbtn.on{border-color:#7c2d12}
.roster.a .pbtn.sel{border-color:var(--a);background:var(--a2);opacity:1} .roster.b .pbtn.sel{border-color:var(--b);background:var(--b2);opacity:1}
.pn{grid-row:1/3;font-size:28px;font-weight:800;min-width:44px;text-align:center}
.pnm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp{font-size:13px;color:var(--mut);text-align:right}
.pf{grid-column:2/4;display:flex;gap:3px}
.pf i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--mut);display:inline-block}
.pf i.f{background:var(--warn);border-color:var(--warn)} .pf i.f4{background:var(--bad);border-color:var(--bad)}
.pbtn.dq{text-decoration:line-through;background:#3f0d0d;opacity:.75}
.pbtn .bdg{position:absolute;top:3px;right:6px;font-size:10px;font-weight:800;color:#fff;background:var(--bad);padding:1px 5px;border-radius:5px;text-decoration:none}
.oncount{font-size:12px;margin:0 0 6px;color:var(--mut)} .oncount b.bad{color:var(--bad)} .oncount b.ok{color:var(--ok)}
.coach{margin-top:8px;width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--panel);opacity:.9;border:2px solid transparent}
.roster.a .coach.sel{border-color:var(--a);background:var(--a2)} .roster.b .coach.sel{border-color:var(--b);background:var(--b2)}
.acts{display:flex;flex-direction:column;gap:8px;min-height:0;background:var(--panel);border-radius:14px;padding:10px}
.selinfo{font-weight:700;padding:8px 10px;border-radius:10px;text-align:center;min-height:42px;display:flex;align-items:center;justify-content:center}
.selinfo.t0{background:var(--a2)} .selinfo.t1{background:var(--b2)} .selinfo.none{background:var(--panel2);color:var(--mut);font-weight:400}
.ag{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ag.f4{grid-template-columns:repeat(4,1fr)}
.ag button{padding:12px 4px;font-size:24px;font-weight:800;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.ag button small{font-size:10px;font-weight:500;color:var(--mut);margin-top:2px}
.ag.pts button{background:#14532d} .ag.fl button{background:#422006}
.ag button:disabled,.subbtn:disabled{opacity:.3}
.subbtn{width:100%;font-weight:700}
.log{flex:1;overflow:auto;min-height:60px;font-size:13px;border-top:1px solid var(--line);padding-top:6px}
.log .ev{display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid #1f2b3d}
.log .ev .tg{width:6px;align-self:stretch;border-radius:3px}
.log .ev .tg.t0{background:var(--a)} .log .ev .tg.t1{background:var(--b)}
.log .ev .tx{flex:1} .log .ev .tm2{color:var(--mut);font-variant-numeric:tabular-nums;font-size:12px}
.log .ev button{padding:2px 8px;font-size:12px;background:transparent;color:var(--mut)}
.lbar{display:flex;gap:6px} .lbar button{flex:1;padding:8px;font-size:14px}

/* modal + toast */
#modal:empty{display:none}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.mbox{background:var(--panel);border-radius:16px;padding:20px;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mbox h3{font-size:19px}
.mbox .mbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;justify-content:flex-end}
.swapgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.swapgrid button{display:flex;flex-direction:column;align-items:center;padding:12px 4px}
.swapgrid button b{font-size:28px} .swapgrid button small{font-size:11px;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subask{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.subask>div{display:flex;flex-direction:column;align-items:center;padding:12px;border-radius:12px;font-size:12px;font-weight:900;letter-spacing:.1em}
.subask b{font-size:44px;line-height:1.1;letter-spacing:0} .subask small{font-size:13px;font-weight:500;letter-spacing:0;color:var(--mut)}
.subask .in{background:rgba(34,197,94,.15);color:#86efac;border:2px solid rgba(34,197,94,.5)}
.subask .out{background:rgba(239,68,68,.12);color:#fca5a5;border:2px solid rgba(239,68,68,.45)}
.subrow{display:grid;grid-template-columns:1fr 52px;gap:6px}
.editp{font-size:20px;padding:6px}
.editp:disabled{opacity:.3}
.addp{background:transparent;border:2px dashed var(--line);color:var(--mut);font-size:13px;padding:8px}
.benchtag{font-size:11px;font-weight:900;background:#000;color:var(--warn);padding:2px 6px;border-radius:5px;margin-left:6px;letter-spacing:.05em}
.mbox .big{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mbox .big button{font-size:28px;font-weight:800;padding:18px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#f8fafc;color:#0f172a;padding:12px 20px;border-radius:12px;font-weight:600;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center}
#toast:empty{display:none}
#toast.bad{background:var(--bad);color:#fff}

/* tablet con schermo basso (es. 1024x600): tutto più compatto */
@media (max-height:700px) and (min-width:901px){
  .sc{font-size:76px} .tn{font-size:24px}
  .clk{font-size:42px} .per{font-size:12px}
  .poss button{font-size:30px} .sirenbtn{font-size:12px}
  .cbtns button{padding:3px 8px}
  .pl{padding:6px;gap:8px}
  .rcol{gap:4px;padding:4px} .rhd{font-size:11px}
  .pbtn{min-height:44px;padding:2px 8px} .pn{font-size:22px;min-width:34px} .pnm{font-size:13px}
  .pf i{width:8px;height:8px}
  .coach{padding:6px 10px;margin-top:6px}
  .ag button{padding:8px 4px;font-size:20px}
}
@media (max-width:900px){
  .live{height:auto;overflow:visible}
  .sb{grid-template-columns:1fr 1fr}
  .ctr{grid-column:1/3;grid-row:1;min-width:0}
  .pl{grid-template-columns:1fr}
  .acts{order:-1}
  .sc{font-size:64px}
  .tn{font-size:20px}
  .clk{font-size:42px}
}

/* ---------- SHEET (referto stampabile) ---------- */
.sheetbar{display:flex;gap:10px;padding:12px 16px;align-items:center;flex-wrap:wrap}
.sheetbar .grow{flex:1}
.sheetwrap{overflow:auto;padding:0 16px 40px}
.sheet{background:#fff;color:#000;width:200mm;min-height:285mm;margin:0 auto;padding:5mm;font-family:Arial,Helvetica,sans-serif;font-size:7.5pt;line-height:1.15}
.sheet table{border-collapse:collapse;width:100%}
.sheet td,.sheet th{border:.6pt solid #000;padding:0 1mm;height:4.1mm;vertical-align:middle}
.sheet th{font-weight:700;background:#eee;font-size:6.5pt}
.sh-head{display:grid;grid-template-columns:1fr 1fr;gap:2mm;margin-bottom:2mm}
.sh-title{grid-column:1/3;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.2pt solid #000;padding-bottom:1mm}
.sh-title b{font-size:14pt;letter-spacing:.05em}
.fld{display:flex;gap:1mm;align-items:flex-end}
.fld span{font-size:6.5pt;white-space:nowrap}
.fld em{flex:1;border-bottom:.6pt solid #000;font-style:normal;font-weight:700;min-height:3.6mm;padding-left:1mm;white-space:nowrap;overflow:hidden}
.sh-body{display:grid;grid-template-columns:118mm 1fr;gap:3mm}
.tblock{border:1pt solid #000;padding:1.2mm;margin-bottom:2mm}
.tblock .thd{display:flex;gap:2mm;align-items:center;font-size:9pt;margin-bottom:1mm}
.tblock .thd b{font-size:10pt}
.tblock .thd .let{border:1pt solid #000;width:5mm;height:5mm;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.tmeta{display:grid;grid-template-columns:auto 1fr;gap:1mm 3mm;margin-bottom:1.2mm;font-size:6.5pt;align-items:center}
.bx{display:inline-flex;width:4.6mm;height:4.2mm;border:.6pt solid #000;align-items:center;justify-content:center;font-weight:700;font-size:7pt;margin-right:-.6pt;vertical-align:middle}
.bx.x{background:#000;color:#fff}
.gap{display:inline-block;width:2mm}
.tfrow{display:flex;gap:3mm;flex-wrap:wrap}
.tfrow span.pl2{font-size:6.5pt;margin-right:.8mm}
.ptbl td.n{text-align:center;font-weight:700;width:7mm}
.ptbl td.e{text-align:center;width:9mm;font-weight:700}
.ptbl td.f{text-align:center;width:7.5mm;font-weight:700;font-size:7pt}
.ptbl td.f sub{font-size:5pt;font-weight:400}
.ptbl td.lic{width:17mm;font-size:6.5pt}
.ptbl td.nm{white-space:nowrap;overflow:hidden;max-width:50mm}
.ptbl tr.coachr td{background:#f6f6f6}
.rs{table-layout:fixed}
.rs th{font-size:6pt;padding:0;text-align:center}
.rs td{height:3.72mm;padding:0;text-align:center;font-size:6.3pt;position:relative}
.rs td.s{color:#666}
.rs td.gs{border-left:1.3pt solid #000}
.rs td.mk{color:#000;font-weight:700;background:linear-gradient(to top right,transparent 46%,#000 47%,#000 53%,transparent 54%)}
.rs td.ft{color:transparent;background:radial-gradient(circle,#000 0 1.1mm,transparent 1.2mm)}
.rs td.num{font-weight:700;color:#000}
.rs td.num.c3 span{display:inline-block;border:.7pt solid #000;border-radius:50%;min-width:3.2mm;line-height:3mm}
.rs td.pe{border-bottom:1.6pt solid #000}
.rs td.fin{outline:1.4pt solid #000;outline-offset:-1.6pt;font-weight:800}
.sh-foot{display:grid;grid-template-columns:1fr 1fr;gap:3mm;margin-top:2mm}
.sh-foot table td{height:5mm}
.sig{display:grid;grid-template-columns:auto 1fr 1fr;gap:1.2mm 2mm;align-items:end;font-size:6.5pt}
.sig em{border-bottom:.6pt solid #000;font-style:normal;font-weight:700;min-height:4mm;padding-left:1mm}
.sig .ln{border-bottom:.6pt solid #000;min-height:4mm}
.note{font-size:6pt;color:#333;margin-top:2mm}

@media print{
  @page{size:A4 portrait;margin:5mm}
  body{background:#fff}
  .noprint,#toast,#modal{display:none!important}
  .sheetwrap{padding:0;overflow:visible}
  .sheet{margin:0;padding:0;width:auto;min-height:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none">
<script>
'use strict';
/* =================== STORAGE =================== */
const LS='refertoBasket_v1';
function loadDB(){
  try{const s=localStorage.getItem(LS); if(s){const d=JSON.parse(s); if(d&&d.teams&&d.games) return d;}}catch(e){}
  return {teams:[],games:[],currentId:null,draft:null};
}
let DB=loadDB();
DB.games.forEach(g=>{g.running=false;});
let saveWarned=false;
function save(){
  try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){if(!saveWarned){saveWarned=true;toast('Attenzione: questo browser non permette il salvataggio. Usa Chrome/Edge aprendo il file direttamente.',true);}}
}

/* =================== UTILS =================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(s){if(!s)return'';const p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s;}
function fmtClock(sec){sec=Math.max(0,sec);if(sec<60)return (Math.floor(sec*10)/10).toFixed(1);const c=Math.ceil(sec);return Math.floor(c/60)+':'+String(c%60).padStart(2,'0');}
function fmtMS(sec){const c=Math.max(0,Math.ceil(sec-1e-6));return String(Math.floor(c/60)).padStart(2,'0')+':'+String(c%60).padStart(2,'0');}
function perLabel(p){return p<=4?'Q'+p:'TS'+(p-4);}
function perLong(p){return p<=4?p+'° QUARTO':(p-4)+'° SUPPLEMENTARE';}
function numSort(a,b){const x=parseInt(a.num,10),y=parseInt(b.num,10);if(isNaN(x)&&isNaN(y))return 0;if(isNaN(x))return 1;if(isNaN(y))return -1;return x-y||String(a.num).length-String(b.num).length;}
function setPath(o,path,v){const k=path.split('.');let c=o;for(let i=0;i<k.length-1;i++){c=c[k[i]];if(c==null)return;}c[k[k.length-1]]=v;}
let toastT;
function toast(msg,bad){const t=$('#toast');t.textContent=msg;t.className=bad?'bad':'';clearTimeout(toastT);toastT=setTimeout(()=>{t.textContent='';},bad?4500:2200);}
function openModal(html){$('#modal').innerHTML=`<div class="mbg" data-a="modalBg"><div class="mbox">${html}</div></div>`;const f=$('#modal input');if(f)setTimeout(()=>f.focus(),30);}
function closeModal(){$('#modal').innerHTML='';}

function download(name,text){const b=new Blob([text],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
/* sirena: suono tipo "buzzer" da palazzetto, finché si tiene premuto */
let actx=null,siren=null;
function audio(){if(!actx){const C=window.AudioContext||window.webkitAudioContext;actx=new C();}if(actx.state==='suspended')actx.resume();return actx;}
function sirenStart(){
  if(siren)return;
  try{const c=audio();const out=c.createGain();out.gain.setValueAtTime(0,c.currentTime);out.gain.linearRampToValueAtTime(.55,c.currentTime+.02);
    const comp=c.createDynamicsCompressor();out.connect(comp);comp.connect(c.destination);
    const oscs=[[440,'sawtooth'],[554,'sawtooth'],[660,'square'],[880,'sawtooth']].map(([f,t])=>{const o=c.createOscillator();o.type=t;o.frequency.value=f;const g=c.createGain();g.gain.value=.25;o.connect(g);g.connect(out);o.start();return o;});
    siren={c,out,oscs,t0:c.currentTime};
    document.querySelectorAll('.sirenbtn').forEach(b=>b.classList.add('on'));
  }catch(e){}
}
function sirenStop(){
  if(!siren)return;const s=siren;siren=null;
  const end=Math.max(s.c.currentTime,s.t0+.6);  // durata minima udibile
  s.out.gain.setValueAtTime(.55,end);s.out.gain.linearRampToValueAtTime(0,end+.06);
  s.oscs.forEach(o=>o.stop(end+.08));
  document.querySelectorAll('.sirenbtn').forEach(b=>b.classList.remove('on'));
}
function beep(ms){sirenStart();setTimeout(sirenStop,ms||1600);}

/* =================== GAME LOGIC =================== */
function stats(g){
  const s={score:[0,0],pp:[[],[]],pf:[[],[]],cf:[[],[]],tf:[[0,0,0,0],[0,0,0,0]],to:[[],[]],per:[[],[]],on:[new Set(),new Set()],ent:[new Set(),new Set()],run:[[],[]],after:{}};
  g.teams.forEach((t,ti)=>t.players.forEach((p,pi)=>{s.pp[ti][pi]=0;s.pf[ti][pi]=[];if(p.starter){s.on[ti].add(pi);s.ent[ti].add(pi);}}));
  for(const e of g.events){
    const ti=e.team;
    if(e.type==='pts'){
      s.score[ti]+=e.pts; s.pp[ti][e.pi]+=e.pts;
      s.per[ti][e.period-1]=(s.per[ti][e.period-1]||0)+e.pts;
      s.run[ti].push({n:s.score[ti],pts:e.pts,num:g.teams[ti].players[e.pi].num,period:e.period});
      s.ent[ti].add(e.pi);
    }else if(e.type==='foul'){
      if(e.pi<0) s.cf[ti].push(e);
      else{s.pf[ti][e.pi].push(e);s.ent[ti].add(e.pi);s.tf[ti][Math.min(e.period,4)-1]++;}
    }else if(e.type==='to') s.to[ti].push(e);
    else if(e.type==='sub'){if(e.dir==='in'){s.on[ti].add(e.pi);s.ent[ti].add(e.pi);}else s.on[ti].delete(e.pi);}
    s.after[e.id]=s.score[0]+'-'+s.score[1];
  }
  return s;
}
function pStatus(f){const c={P:0,T:0,U:0,D:0};f.forEach(x=>c[x.ftype]++);if(c.D||c.T>=2||c.U>=2||(c.T&&c.U))return 'GD';if(f.length>=5)return '5F';return '';}
function cStatus(f){const c={C:0,B:0,D:0};f.forEach(x=>c[x.ftype]++);if(c.D||c.C>=2||c.C+c.B>=3)return 'GD';return '';}
function fcode(f){return f.ftype+(f.ft?f.ft:'');}
function toSeg(p){return p<=2?'h1':p<=4?'h2':'ot'+p;}
function toLimit(p){return p<=2?2:p<=4?3:1;}
function perLen(g,p){return (p>4?g.otLength:g.periodLength)*60;}
function curTeamFouls(g,s,ti){return s.tf[ti][Math.min(g.period,4)-1];}
function toMinute(g,e){const el=perLen(g,e.period)-e.clock;return Math.max(1,Math.ceil(el/60-1e-9));}

function onBench(sel){if(!sel||sel.pi<0)return false;const g=cur();return !stats(g).on[sel.t].has(sel.pi);}
function pushEv(e){const g=cur();e.id=uid();e.period=g.period;e.clock=Math.round(g.clock*10)/10;g.events.push(e);}
/* giocatore in panchina: chiede chi esce, registra il cambio e poi l'azione */
function askSwap(sel,next,what){
  const g=cur();const s=stats(g);const t=g.teams[sel.t];const p=t.players[sel.pi];
  const st=pStatus(s.pf[sel.t][sel.pi]);
  if(st){toast(`#${p.num} è in panchina e non può rientrare (${st==='GD'?'espulso':'5 falli'})`,true);return;}
  view.swap={t:sel.t,pi:sel.pi,next};
  const on=[...s.on[sel.t]].sort((a,b)=>numSort(t.players[a],t.players[b]));
  openModal(`<h3>#${esc(p.num)} ${esc(p.last)} è in panchina</h3>
    <div class="mut">Per ${what} deve essere in campo. <b>Chi esce?</b></div>
    <div class="swapgrid">${on.map(i=>`<button data-a="swapDo" data-o="${i}"><b>${esc(t.players[i].num)}</b><small>${esc(t.players[i].last)}</small></button>`).join('')}</div>
    ${on.length<5?`<button class="ghost" style="width:100%;margin-top:8px" data-a="swapDo" data-o="-1">Entra senza far uscire nessuno (in campo solo ${on.length})</button>`:''}
    <div class="mbtns"><button class="ghost" data-a="closeModal">Annulla – giocatore sbagliato</button></div>`);
}
function addPlayerToGame(ti,p){
  const g=cur();const t=g.teams[ti];const num=String(p.num||'').trim();
  if(t.players.length>=12){toast('A referto ci sono già 12 giocatori',true);return;}
  if(!num){toast('Inserisci il numero di maglia',true);return;}
  if(!String(p.last||'').trim()){toast('Inserisci il cognome',true);return;}
  if(t.players.some(q=>String(q.num).trim()===num)){toast(`Il numero ${num} è già a referto`,true);return;}
  t.players.push({num,last:String(p.last).trim(),first:String(p.first||'').trim(),lic:String(p.lic||'').trim(),starter:false,captain:false});
  save();closeModal();render();toast(`#${num} ${p.last} aggiunto a referto (in panchina)`);
}
function addEv(e){
  const g=cur(); if(!g) return;
  e.id=uid(); e.period=g.period; e.clock=Math.round(g.clock*10)/10;
  g.events.push(e); save();
  const s=stats(g);
  if(e.type==='foul'){
    if(e.pi>=0){const f=s.pf[e.team][e.pi];const st=pStatus(f);const p=g.teams[e.team].players[e.pi];
      if(st==='GD')toast(`#${p.num} ${p.last}: ESPULSO (squalificato) – effettuare la sostituzione`,true);
      else if(st==='5F')toast(`#${p.num} ${p.last}: 5 FALLI – deve uscire`,true);
      else if(f.length===4)toast(`#${p.num} ${p.last}: 4° fallo`);
      const tf=curTeamFouls(g,s,e.team); if(tf===4)toast(`${g.teams[e.team].name}: 4 falli di squadra – BONUS dal prossimo`);
    }else{const st=cStatus(s.cf[e.team]);if(st)toast(`Allenatore ${g.teams[e.team].name}: ESPULSO`,true);}
  }
  view.sel=null; render();
}

/* =================== CLOCK =================== */
let lastTick=0, saveTick=0, wakeLock=null;
setInterval(()=>{
  const g=cur(); if(g&&g.toTimer) toTick(g);
  if(!g||!g.running) return;
  const now=performance.now(); g.clock-=(now-lastTick)/1000; lastTick=now;
  if(g.clock<=0){g.clock=0;g.running=false;save();beep();render();toast(`Fine ${perLong(g.period).toLowerCase()}`);return;}
  if(now-saveTick>5000){saveTick=now;save();}
  updClock();
},100);
/* timer del timeout: 60 s, sirena a 10 s dalla fine (50") e alla fine */
const TO_SEC=60;
function toLeft(g){return Math.max(0,(g.toTimer.end-Date.now())/1000);}
function toTick(g){
  const left=toLeft(g);
  if(!g.toTimer.warned&&left<=10){g.toTimer.warned=true;save();beep(700);}
  if(left<=0){g.toTimer=null;save();beep(1600);toast('Fine timeout');if(view.screen==='live')render();return;}
  const el=document.getElementById('toTime');if(el){el.textContent=Math.ceil(left);el.parentElement.classList.toggle('warn',left<=10);}
  const bar=document.getElementById('toBar');if(bar)bar.style.width=(left/TO_SEC*100)+'%';
}
function toBannerHTML(g){
  const t=g.toTimer;const left=toLeft(g);
  return `<div class="tobanner t${t.team} ${left<=10?'warn':''}">
    <div class="tolbl">TIMEOUT<b>${esc(g.teams[t.team].name)}</b></div>
    <div class="tonum" id="toTime">${Math.ceil(left)}</div>
    <button data-a="toEnd">Termina</button>
    <div class="toprog"><i id="toBar" style="width:${left/TO_SEC*100}%"></i></div>
  </div>`;
}
function updClock(){const g=cur();const el=document.getElementById('clock');if(!g||!el)return;el.textContent=fmtClock(g.clock);el.classList.toggle('run',!!g.running);}
function clockToggle(){const g=cur();if(!g||g.status!=='live')return;if(!g.running&&g.clock<=0){toast('Tempo scaduto: chiudi il periodo');return;}try{audio();}catch(e){}
  g.running=!g.running;lastTick=performance.now();
  if(g.running&&g.toTimer){g.toTimer=null;save();render();return;} // ripresa del gioco: chiude il timeout
  save();updClock();}
async function keepAwake(){try{if('wakeLock' in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&view.screen==='live')keepAwake();});

function dots(n,max){let h='';for(let i=0;i<max;i++)h+=`<i class="${i<n?(n>=4?'f f4':'f'):''}"></i>`;return h;}
function teamHeader(g,s,ti){
  const t=g.teams[ti];const used=s.to[ti].filter(e=>toSeg(e.period)===toSeg(g.period)).length;const lim=toLimit(g.period);
  let tob='';for(let i=0;i<lim;i++)tob+=`<i class="${i<used?'u':''}"></i>`;

  return `<div class="tm ${ti?'b':'a'} ${poss?'hasposs':''}">
    <div class="l1"><div class="tn">${esc(t.name)}</div>${poss?`<span class="posstag">${ti?'POSSESSO ▶':'◀ POSSESSO'}</span>`:''}<div class="sc">${s.score[ti]}</div></div>

function rosterHTML(g,s,ti){
  const t=g.teams[ti];const on=s.on[ti].size;

      <span class="pf">${dots(f.length,5)}</span>${st?`<span class="bdg">${st==='GD'?'GD':'5F'}</span>`:''}</button>`;};
  const idx=t.players.map((p,i)=>i).sort((a,b)=>numSort(t.players[a],t.players[b]));

    <div class="rcol benchcol"><div class="rhd">PANCHINA <b>${bench.length}</b></div>${bench.map(btn).join('')}${t.players.length<12?`<button class="addp" data-a="addPOpen" data-t="${ti}">＋ Aggiungi a referto</button>`:''}</div>
  </div>`;

  return h;
}
function evText(g,e){
  const t=g.teams[e.team];const p=e.pi>=0?t.players[e.pi]:null;const who=p?`#${esc(p.num)} ${esc(p.last)}`:`All. ${esc(t.coach||'')}`;
  if(e.type==='pts')return `${who} <b>+${e.pts}</b>`;
  if(e.type==='foul')return `${who} fallo <b>${fcode(e)}</b>`;
  if(e.type==='to')return `<b>Timeout</b> ${esc(t.name)}`;
  if(e.type==='sub')return `${who} ${e.dir==='in'?'⇡ entra':'⇣ esce'}`;
  return '';
}
function actsHTML(g,s){

  }

  h+=`<div class="log">${g.events.slice().reverse().slice(0,60).map(e=>`<div class="ev"><span class="tg t${e.team}"></span><span class="tm2">${perLabel(e.period)} ${fmtMS(e.clock)}</span><span class="tx">${evText(g,e)}</span><span class="tm2">${s.after[e.id]}</span><button data-a="delEv" data-id="${e.id}" title="Elimina">✕</button></div>`).join('')||'<div class="mut sm">Nessun evento</div>'}</div>`;

function sheetHTML(g){
  const s=stats(g);const I=g.info;

  let h=`<div class="sheet">
  <div class="sh-head">
    <div class="sh-title"><b>REFERTO DI GARA</b><span>${esc(I.competition)}</span></div>
    <div>${fld('Squadra A',g.teams[0].name)}${fld('Squadra B',g.teams[1].name)}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1mm 3mm">${fld('Gara n°',I.gameNo)}${fld('Data',fmtDate(I.date))}${fld('Ora',I.time)}${fld('Luogo',I.place)}</div>
    <div style="grid-column:1/3;display:grid;grid-template-columns:1fr 1fr 1fr;gap:3mm">${fld('1° Arbitro',I.crew)}${fld('2° Arbitro',I.ump1)}${fld('3° Arbitro',I.ump2)}</div>
  </div>
  <div class="sh-body"><div>${sheetTeam(g,s,0)}${sheetTeam(g,s,1)}</div><div>${sheetRunning(g,s)}</div></div>

  return h;
}
function sheetTeam(g,s,ti){
  const t=g.teams[ti];
  const toList=seg=>s.to[ti].filter(e=>seg==='ot'?e.period>4:toSeg(e.period)===seg);
  const boxes=(list,n)=>{let h='';for(let i=0;i<n;i++){const e=list[i];h+=`<span class="bx">${e?toMinute(g,e):''}</span>`;}return h;};
  const ot=toList('ot');
  let tf='';for(let p=0;p<4;p++){tf+=`<span><span class="pl2">Q${p+1}</span>`;for(let i=1;i<=4;i++)tf+=`<span class="bx ${s.tf[ti][p]>=i?'x':''}">${s.tf[ti][p]>=i?i:''}</span>`;tf+='</span>';}
  let rows='';
  const order=t.players.map((p,i)=>i).sort((a,b)=>numSort(t.players[a],t.players[b]));
  for(let r=0;r<Math.max(12,order.length);r++){
    const i=order[r];const p=t.players[i];
    if(!p){rows+=`<tr><td class="lic"></td><td class="nm"></td><td class="n"></td><td class="e"></td>${'<td class="f"></td>'.repeat(5)}</tr>`;continue;}
    const f=s.pf[ti][i];const st=pStatus(f);
    const ent=p.starter?'ⓧ':(s.ent[ti].has(i)?'X':'');
    let fc='';for(let k=0;k<5;k++){const x=f[k];fc+=`<td class="f">${x?`${fcode(x)}<sub>${perLabel(x.period)}</sub>`:(st==='GD'?'GD':'')}</td>`;}
    rows+=`<tr><td class="lic">${esc(p.lic)}</td><td class="nm">${esc(p.last)} ${esc(p.first)}${p.captain?' <b>(CAP)</b>':''}</td><td class="n">${esc(p.num)}</td><td class="e">${ent}</td>${fc}</tr>`;
  }
  const cf=s.cf[ti];const cst=cStatus(cf);
  let cc='';for(let k=0;k<3;k++){const x=cf[k];cc+=`<td class="f">${x?`${fcode(x)}<sub>${perLabel(x.period)}</sub>`:(cst==='GD'?'GD':'')}</td>`;}
  rows+=`<tr class="coachr"><td class="lic">${esc(t.coachLic||'')}</td><td class="nm" colspan="3">Allenatore: <b>${esc(t.coach)}</b></td>${cc}<td class="f"></td><td class="f"></td></tr>`;
  rows+=`<tr class="coachr"><td class="lic"></td><td class="nm" colspan="3">1° Assistente: <b>${esc(t.assistant)}</b></td><td colspan="5"></td></tr>`;
  return `<div class="tblock">
    <div class="thd"><span class="let">${ti?'B':'A'}</span><span>Squadra</span><b>${esc(t.name)}</b></div>
    <div class="tmeta">
      <span>Sospensioni</span><span>${boxes(toList('h1'),2)}<span class="gap"></span>${boxes(toList('h2'),3)}<span class="gap"></span>${boxes(ot,Math.max(3,ot.length))}</span>
      <span>Falli di squadra</span><span class="tfrow">${tf}</span>
    </div>
    <table class="ptbl"><tr><th>Licenza</th><th>Giocatori</th><th>N°</th><th>Entr.</th><th colspan="5">Falli</th></tr>${rows}</table>
  </div>`;
}
function sheetRunning(g,s){
  const hit=[{},{}],pe=[new Set(),new Set()];
  [0,1].forEach(ti=>s.run[ti].forEach((r,i,a)=>{hit[ti][r.n]=r;const nx=a[i+1];if(!nx||nx.period!==r.period)pe[ti].add(r.n);}));
  const R=Math.max(40,Math.ceil(Math.max(s.score[0],s.score[1])/4));
  let h=`<table class="rs"><tr><th colspan="16">PUNTEGGIO PROGRESSIVO</th></tr><tr>`;
  for(let k=0;k<4;k++)h+=`<th>A</th><th></th><th></th><th>B</th>`;
  h+='</tr>';
  const cell=(ti,n,first)=>{const r=hit[ti][n];const cls=[];if(pe[ti].has(n))cls.push('pe');
    const num=`<td class="num ${r&&r.pts===3?'c3':''} ${cls.join(' ')} ${first?'gs':''}">${r?`<span>${esc(r.num)}</span>`:''}</td>`;
    const sc=`<td class="s ${r?(r.pts===1?'ft':'mk'):''} ${cls.join(' ')} ${n===s.score[ti]&&n>0?'fin':''}">${n}</td>`;
    return ti===0?num+sc:sc+num;};
  for(let r=1;r<=R;r++){h+='<tr>';for(let k=0;k<4;k++){const n=k*R+r;h+=cell(0,n,true)+cell(1,n,false);}h+='</tr>';}
  return h+'</table><div class="note">Legenda: ● tiro libero · / canestro da 2 · numero cerchiato = canestro da 3 · linea spessa = fine periodo · riquadro = punteggio finale. Falli: P personale, T tecnico, U antisportivo, D da espulsione, C/B tecnico allenatore/panchina; il numero indica i tiri liberi assegnati; GD = espulsione.</div>';
}
function sheetFoot(g,s){
  const P=(ti,i)=>s.per[ti][i]||0;
  const maxP=Math.max(4,g.period);let ot=[0,0];for(let i=4;i<maxP;i++){ot[0]+=P(0,i);ot[1]+=P(1,i);}
  const win=g.status==='finished'?(s.score[0]>s.score[1]?g.teams[0].name:s.score[1]>s.score[0]?g.teams[1].name:'—'):'';
  const I=g.info;
  const sg=(l,v)=>`<span>${l}</span><em>${esc(v)}</em><span class="ln"></span>`;
  return `<div class="sh-foot">
    <div><table>
      <tr><th>Punteggio</th><th>A</th><th>B</th></tr>
      ${[0,1,2,3].map(i=>`<tr><td>${i+1}° Quarto</td><td style="text-align:center">${P(0,i)}</td><td style="text-align:center">${P(1,i)}</td></tr>`).join('')}
      <tr><td>Supplementari</td><td style="text-align:center">${maxP>4?ot[0]:''}</td><td style="text-align:center">${maxP>4?ot[1]:''}</td></tr>
      <tr><td><b>Punteggio finale</b></td><td style="text-align:center"><b>${s.score[0]}</b></td><td style="text-align:center"><b>${s.score[1]}</b></td></tr>
      <tr><td>Squadra vincente</td><td colspan="2"><b>${esc(win)}</b></td></tr>
      <tr><td>Ora fine gara</td><td colspan="2">${g.endedAt?new Date(g.endedAt).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):''}</td></tr>
    </table></div>
    <div class="sig">
      <span></span><span><b>Nome</b></span><span><b>Firma</b></span>
      ${sg('Segnapunti',I.scorer)}${sg('Aiuto segnapunti',I.assistScorer)}${sg('Cronometrista',I.timer)}${sg('Addetto 24"',I.shotClock)}
      ${sg('1° Arbitro',I.crew)}${sg('2° Arbitro',I.ump1)}${sg('3° Arbitro',I.ump2)}
      <span>Firma capitano in caso di reclamo</span><span></span><span class="ln"></span>
    </div>
  </div>`;
}

/* =================== ACTIONS =================== */
const ACT={
  nav:d=>go(d.s),
  modalBg:(d,el,e)=>{if(e.target===el)closeModal();},
  closeModal:()=>closeModal(),
  confirmOk:()=>{const cb=confirmCb;confirmCb=null;closeModal();if(cb)cb();},

  /* teams */
  teamNew:()=>{view.teamEdit={id:null,name:'',coach:'',coachLic:'',assistant:'',players:[]};for(let i=0;i<10;i++)view.teamEdit.players.push({num:'',last:'',first:'',lic:''});go('teamEdit');},
  teamEdit:d=>{view.teamEdit=clone(DB.teams.find(t=>t.id===d.id));go('teamEdit');},
  teamAddP:()=>{view.teamEdit.players.push({num:'',last:'',first:'',lic:''});render();},
  teamDelP:d=>{view.teamEdit.players.splice(+d.i,1);render();},
  teamSave:()=>{const t=view.teamEdit;if(!t.name.trim()){toast('Inserisci il nome della squadra',true);return;}
    t.players=t.players.filter(p=>(p.num+p.last+p.first).trim()).sort(numSort);
    if(t.id){const i=DB.teams.findIndex(x=>x.id===t.id);DB.teams[i]=t;}else{t.id=uid();DB.teams.push(t);}
    save();toast('Squadra salvata');go('teams');},
  teamDelete:()=>ask('Eliminare la squadra?','Le gare già salvate non vengono modificate.','Elimina',()=>{DB.teams=DB.teams.filter(t=>t.id!==view.teamEdit.id);save();go('teams');},true),

  /* setup */
  newGame:()=>{if(!DB.draft){DB.draft=newDraft();save();}go('setup');},
  draftDiscard:()=>ask('Scartare la bozza?','Tutti i dati inseriti per questa gara andranno persi.','Scarta',()=>{DB.draft=null;save();go('home');},true),
  draftAddP:d=>{DB.draft.teams[+d.t].players.push({num:'',last:'',first:'',lic:'',sel:true,starter:false,captain:false});save();render();},
  draftDelP:d=>{DB.draft.teams[+d.t].players.splice(+d.i,1);save();render();},
  draftSaveTeam:d=>{const t=DB.draft.teams[+d.t];if(!t.name.trim()){toast('Inserisci il nome della squadra',true);return;}
    const players=t.players.filter(p=>(p.num+p.last+p.first).trim()).map(p=>({num:p.num,last:p.last,first:p.first,lic:p.lic})).sort(numSort);
    const ex=DB.teams.find(x=>x.name.trim().toLowerCase()===t.name.trim().toLowerCase());
    const doSave=()=>{if(ex){ex.players=players;ex.coach=t.coach;ex.coachLic=t.coachLic;ex.assistant=t.assistant;}else DB.teams.push({id:uid(),name:t.name.trim(),coach:t.coach,coachLic:t.coachLic,assistant:t.assistant,players});save();toast('Squadra salvata in anagrafica');render();};
    if(ex)ask('Aggiornare la squadra?',`“${esc(ex.name)}” esiste già in anagrafica: sostituire i suoi giocatori con questi?`,'Aggiorna',doSave);else doSave();},
  startGame:()=>{
    const d=DB.draft;const errs=[];
    d.teams.forEach((t,ti)=>{const L=ti?'B':'A';const sel=t.players.filter(p=>p.sel);
      if(!t.name.trim())errs.push(`Squadra ${L}: manca il nome`);
      if(sel.length<5||sel.length>12)errs.push(`Squadra ${L}: a referto ${sel.length} giocatori (servono da 5 a 12)`);
      if(sel.filter(p=>p.starter).length!==5)errs.push(`Squadra ${L}: il quintetto deve avere 5 giocatori`);
      const nums=sel.map(p=>String(p.num).trim());if(nums.some(n=>!n))errs.push(`Squadra ${L}: numero di maglia mancante`);
      if(new Set(nums).size!==nums.length)errs.push(`Squadra ${L}: numeri di maglia duplicati`);});
    const pl=+d.periodLength,ol=+d.otLength;if(!(pl>0)||!(ol>0))errs.push('Durata dei periodi non valida');
    if(errs.length){openModal(`<h3>Controlla i dati</h3><ul>${errs.map(e=>`<li>${esc(e)}</li>`).join('')}</ul><div class="mbtns"><button class="pri" data-a="closeModal">OK</button></div>`);return;}
    const g={id:d.id,created:d.created,status:'live',info:clone(d.info),periodLength:pl,otLength:ol,period:1,clock:pl*60,running:false,events:[],arrow:null,
      teams:d.teams.map(t=>({name:t.name.trim(),coach:t.coach,coachLic:t.coachLic,assistant:t.assistant,
        players:t.players.filter(p=>p.sel).map(p=>({num:String(p.num).trim(),last:p.last,first:p.first,lic:p.lic,starter:!!p.starter,captain:!!p.captain})).sort(numSort)}))};
    DB.games.unshift(g);DB.currentId=g.id;DB.draft=null;save();go('live');},

  /* live */
  resume:d=>{DB.currentId=d.id;save();go('live');},
  sel:d=>{const t=+d.t,i=+d.i;if(view.sel&&view.sel.t===t&&view.sel.pi===i){view.sel=null;render();return;}
    const prev=view.sel;
    // panchina → poi giocatore in campo della stessa squadra: probabile cambio
    if(prev&&prev.t===t&&prev.pi>=0&&i>=0&&onBench(prev)&&!onBench({t,pi:i})){
      const g=cur();const s=stats(g);const P=g.teams[t].players;const st=pStatus(s.pf[t][prev.pi]);
      if(!st){view.subAsk={t,inn:prev.pi,out:i};
        openModal(`<h3>Cambio?</h3>
          <div class="subask"><div class="in">⇡ ENTRA<b>${esc(P[prev.pi].num)}</b><small>${esc(P[prev.pi].last)}</small></div><div class="out">⇣ ESCE<b>${esc(P[i].num)}</b><small>${esc(P[i].last)}</small></div></div>
          <div class="mbtns"><button class="ghost" data-a="subAskNo">No, seleziona solo #${esc(P[i].num)}</button><button class="ok" data-a="subAskYes">Sì, registra il cambio</button></div>`);
        return;}
    }
    view.sel={t,pi:i};render();},
  subAskYes:()=>{const a=view.subAsk;closeModal();if(!a)return;view.subAsk=null;
    pushEv({type:'sub',team:a.t,pi:a.out,dir:'out'});addEv({type:'sub',team:a.t,pi:a.inn,dir:'in'});
    const P=cur().teams[a.t].players;toast(`Cambio: entra #${P[a.inn].num}, esce #${P[a.out].num}`);},
  subAskNo:()=>{const a=view.subAsk;closeModal();if(!a)return;view.subAsk=null;view.sel={t:a.t,pi:a.out};render();},
  pts:d=>{if(!view.sel)return;
    if(onBench(view.sel)){askSwap(view.sel,{kind:'pts',n:+d.n},`assegnare ${d.n} punt${d.n==='1'?'o':'i'}`);return;}
    addEv({type:'pts',team:view.sel.t,pi:view.sel.pi,pts:+d.n});},
  swapDo:d=>{const sw=view.swap;closeModal();if(!sw)return;view.swap=null;const g=cur();
    const o=+d.o; if(o>=0)pushEv({type:'sub',team:sw.t,pi:o,dir:'out'}); pushEv({type:'sub',team:sw.t,pi:sw.pi,dir:'in'});
    view.sel={t:sw.t,pi:sw.pi};
    if(sw.next.kind==='pts')addEv({type:'pts',team:sw.t,pi:sw.pi,pts:sw.next.n});
    else{save();render();ACT.foul({f:sw.next.f});}},
  benchB:()=>{const sel=view.sel;closeModal();if(!sel)return;view.sel={t:sel.t,pi:-1};ACT.foul({f:'B'});},
  benchTSwap:()=>{const sel=view.sel;closeModal();if(sel)askSwap(sel,{kind:'foul',f:'T'},'registrare il fallo tecnico');},
  foul:d=>{if(!view.sel)return;
    if(onBench(view.sel)){
      if(d.f==='P'||d.f==='U'){askSwap(view.sel,{kind:'foul',f:d.f},'registrare il fallo');return;}
      if(d.f==='T'){const p=cur().teams[view.sel.t].players[view.sel.pi];
        openModal(`<h3>#${esc(p.num)} è in panchina</h3><div class="mut">Un fallo tecnico a un giocatore in panchina va registrato all'<b>allenatore</b> come fallo <b>B</b>.</div><div class="mbtns"><button class="ghost" data-a="closeModal">Annulla</button><button data-a="benchTSwap">Era in campo: registra il cambio</button><button class="pri" data-a="benchB">Registra B all'allenatore</button></div>`);return;}
    }
    view.pending={t:view.sel.t,pi:view.sel.pi,f:d.f};
    const opts=(d.f==='T'||d.f==='C'||d.f==='B')?[0,1]:[0,1,2,3];
    const names={P:'personale',T:'tecnico',U:'antisportivo',D:'da espulsione',C:'tecnico allenatore',B:'tecnico panchina'};
    openModal(`<h3>Fallo ${names[d.f]} – tiri liberi?</h3><div class="big" style="grid-template-columns:repeat(${opts.length},1fr)">${opts.map(n=>`<button data-a="foulFT" data-n="${n}">${n}</button>`).join('')}</div><div class="mbtns"><button class="ghost" data-a="closeModal">Annulla</button></div>`);},
  foulFT:d=>{const p=view.pending;closeModal();if(!p)return;view.pending=null;const g=cur();if(g&&g.running){g.running=false;}addEv({type:'foul',team:p.t,pi:p.pi,ftype:p.f,ft:+d.n});},
  sub:()=>{if(!view.sel||view.sel.pi<0)return;const g=cur();const s=stats(g);const on=s.on[view.sel.t].has(view.sel.pi);
    const p=g.teams[view.sel.t].players[view.sel.pi];
    if(!on&&pStatus(s.pf[view.sel.t][view.sel.pi])){toast(`#${p.num} non può rientrare (${pStatus(s.pf[view.sel.t][view.sel.pi])})`,true);return;}
    addEv({type:'sub',team:view.sel.t,pi:view.sel.pi,dir:on?'out':'in'});},
  timeout:d=>{const g=cur();const s=stats(g);const ti=+d.t;const used=s.to[ti].filter(e=>toSeg(e.period)===toSeg(g.period)).length;
    const doTo=()=>{try{audio();}catch(e){} g.running=false;addEv({type:'to',team:ti,pi:-1});const ev=g.events[g.events.length-1];
      g.toTimer={team:ti,ev:ev.id,end:Date.now()+TO_SEC*1000,warned:false};save();render();toast(`Timeout ${g.teams[ti].name}: 60 secondi`);};
    let warn='';
    if(used>=toLimit(g.period))warn=`${esc(g.teams[ti].name)} ha già usato tutti i timeout di questa frazione (${toLimit(g.period)}).`;
    else if(g.period===4&&g.clock<=120&&s.to[ti].filter(e=>e.period===4&&e.clock<=120).length>=2)warn='Negli ultimi 2 minuti del 4° quarto sono concessi al massimo 2 timeout.';
    if(warn)ask('Timeout non disponibile',warn+' Registrarlo comunque?','Registra',doTo,true);else doTo();},
  undo:()=>{const g=cur();if(!g.events.length)return;const e=g.events[g.events.length-1];
    ask('Annullare l’ultimo evento?',`${perLabel(e.period)} ${fmtMS(e.clock)} – ${evText(g,e)}`,'Annulla evento',()=>{g.events.pop();if(g.toTimer&&g.toTimer.ev===e.id)g.toTimer=null;save();render();});},
  delEv:d=>{const g=cur();const e=g.events.find(x=>x.id===d.id);if(!e)return;
    ask('Eliminare questo evento?',`${perLabel(e.period)} ${fmtMS(e.clock)} – ${evText(g,e)}<br><br>Il punteggio progressivo verrà ricalcolato.`,'Elimina',()=>{g.events=g.events.filter(x=>x.id!==d.id);if(g.toTimer&&g.toTimer.ev===d.id)g.toTimer=null;save();render();},true);},
  toEnd:()=>{const g=cur();if(!g||!g.toTimer)return;g.toTimer=null;save();render();},
  clockToggle:()=>clockToggle(),
  clk:d=>{const g=cur();g.clock=Math.min(perLen(g,g.period),Math.max(0,g.clock+(+d.d)));save();updClock();},
  clkEdit:()=>{const g=cur();g.running=false;save();updClock();
    openModal(`<h3>Imposta cronometro</h3><label>Tempo rimanente (mm:ss oppure ss.d)</label><input id="clkIn" value="${fmtMS(g.clock)}"><div class="mbtns"><button class="ghost" data-a="closeModal">Annulla</button><button class="pri" data-a="clkSet">Imposta</button></div>`);},
  clkSet:()=>{const g=cur();const v=$('#clkIn').value.trim();let sec;
    if(v.includes(':')){const [m,s2]=v.split(':');sec=(+m)*60+(+s2);}else sec=parseFloat(v.replace(',','.'));
    if(isNaN(sec)||sec<0||sec>perLen(g,g.period)){toast('Valore non valido',true);return;}
    g.clock=sec;save();closeModal();updClock();},
  arrow:d=>{const g=cur();const t=+d.t;g.arrow=(g.arrow==null)?t:1-g.arrow;save();render();toast(`Possesso alternato: ${g.teams[g.arrow].name}`);},
  endPeriod:()=>{const g=cur();const s=stats(g);
    if(g.period>=4&&s.score[0]!==s.score[1]){ask('Terminare la gara?',`Risultato finale: <b>${esc(g.teams[0].name)} ${s.score[0]} – ${s.score[1]} ${esc(g.teams[1].name)}</b>`,'Fine gara',()=>{g.running=false;g.status='finished';g.endedAt=Date.now();save();view.sheetId=g.id;view.sheetFrom='live';go('sheet');});return;}
    const next=g.period+1;
    ask(`Chiudere il ${perLabel(g.period)}?`,(g.period>=4?'Punteggio in parità: si passa al <b>tempo supplementare</b>. ':'')+`Il cronometro verrà impostato a ${fmtMS(perLen(g,next))} per il ${perLabel(next)}.`+(g.clock>0?`<br><br><b>Attenzione:</b> restano ancora ${fmtClock(g.clock)} sul cronometro.`:''),`Vai al ${perLabel(next)}`,
      ()=>{g.running=false;g.period=next;g.clock=perLen(g,next);save();render();});},
  liveMenu:()=>{const g=cur();openModal(`<h3>Menu gara</h3>
    <div style="display:grid;gap:8px">
      <button data-a="sheet" data-id="${g.id}">📄 Visualizza / stampa referto</button>
      <div class="row">${[0,1].map(ti=>`<button style="flex:1" data-a="addPOpen" data-t="${ti}" ${g.teams[ti].players.length>=12?'disabled':''}>＋ Giocatore a referto<br><small class="mut">${esc(g.teams[ti].name)} (${g.teams[ti].players.length}/12)</small></button>`).join('')}</div>
      <div class="row"><span style="flex:1">Periodo: <b>${perLabel(g.period)}</b></span><button data-a="perAdj" data-d="-1">−</button><button data-a="perAdj" data-d="1">＋</button></div>
      ${g.status==='finished'?`<button data-a="reopen">↺ Riapri gara (correzioni)</button>`:`<button class="bad" data-a="forceEnd">🏁 Termina gara ora</button>`}
      <button data-a="fullscreen">⛶ Schermo intero</button>
      <button data-a="nav" data-s="home">← Torna al menu principale</button>
    </div><div class="mbtns"><button class="ghost" data-a="closeModal">Chiudi</button></div>`);},
  addPOpen:d=>{const g=cur();const ti=+d.t;const t=g.teams[ti];
    if(t.players.length>=12){toast('A referto ci sono già 12 giocatori',true);return;}
    const ana=DB.teams.find(x=>x.name.trim().toLowerCase()===t.name.trim().toLowerCase());
    const inGame=p=>t.players.some(q=>String(q.num).trim()===String(p.num).trim()&&q.last.trim().toLowerCase()===String(p.last).trim().toLowerCase());
    const avail=ana?ana.players.map((p,k)=>({p,k})).filter(x=>!inGame(x.p)).sort((a,b)=>numSort(a.p,b.p)):[];
    openModal(`<h3>Aggiungi a referto – ${esc(t.name)}</h3><div class="mut sm">Ora ${t.players.length}/12. Il giocatore entra in panchina.</div>
      ${avail.length?`<label style="margin-top:12px">Dall'anagrafica</label><div class="swapgrid">${avail.map(x=>`<button data-a="addPAna" data-t="${ti}" data-k="${x.k}"><b>${esc(x.p.num)}</b><small>${esc(x.p.last)}</small></button>`).join('')}</div>`:''}
      <label style="margin-top:14px">${avail.length?'Oppure inserisci a mano':'Nuovo giocatore'}</label>
      <div style="display:grid;grid-template-columns:70px 1fr 1fr;gap:6px"><input id="apNum" placeholder="N°" inputmode="numeric"><input id="apLast" placeholder="Cognome"><input id="apFirst" placeholder="Nome"></div>
      <input id="apLic" placeholder="Licenza (facoltativa)" style="margin-top:6px">
      <div class="mbtns"><button class="ghost" data-a="closeModal">Annulla</button><button class="ok" data-a="addPManual" data-t="${ti}">Aggiungi</button></div>`);},
  addPAna:d=>{const t=cur().teams[+d.t];const ana=DB.teams.find(x=>x.name.trim().toLowerCase()===t.name.trim().toLowerCase());const p=ana&&ana.players[+d.k];if(p)addPlayerToGame(+d.t,p);},
  editPOpen:()=>{const sel=view.sel;if(!sel||sel.pi<0)return;const p=cur().teams[sel.t].players[sel.pi];view.editP={t:sel.t,pi:sel.pi};
    openModal(`<h3>Correggi giocatore</h3><div class="mut sm">Punti, falli e cambi già registrati restano a questo giocatore.</div>
      <div style="display:grid;grid-template-columns:70px 1fr 1fr;gap:6px;margin-top:12px"><div><label>N°</label><input id="epNum" value="${esc(p.num)}" inputmode="numeric"></div><div><label>Cognome</label><input id="epLast" value="${esc(p.last)}"></div><div><label>Nome</label><input id="epFirst" value="${esc(p.first)}"></div></div>
      <div style="margin-top:6px"><label>Licenza</label><input id="epLic" value="${esc(p.lic)}"></div>
      <label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:15px;color:var(--txt)"><input type="checkbox" id="epCap" ${p.captain?'checked':''}> Capitano</label>
      <div class="mbtns"><button class="ghost" data-a="closeModal">Annulla</button><button class="ok" data-a="editPSave">Salva</button></div>`);},
  editPSave:()=>{const e=view.editP;if(!e)return;const t=cur().teams[e.t];const p=t.players[e.pi];
    const num=$('#epNum').value.trim(),last=$('#epLast').value.trim();
    if(!num){toast('Inserisci il numero di maglia',true);return;}
    if(!last){toast('Inserisci il cognome',true);return;}
    if(t.players.some((q,i)=>i!==e.pi&&String(q.num).trim()===num)){toast(`Il numero ${num} è già a referto`,true);return;}
    const old=p.num;p.num=num;p.last=last;p.first=$('#epFirst').value.trim();p.lic=$('#epLic').value.trim();
    if($('#epCap').checked)t.players.forEach((q,i)=>q.captain=i===e.pi);else p.captain=false;
    view.editP=null;save();closeModal();render();toast(old!==num?`Numero corretto: ${old} → ${num}`:'Giocatore aggiornato');},
  addPManual:d=>addPlayerToGame(+d.t,{num:$('#apNum').value,last:$('#apLast').value,first:$('#apFirst').value,lic:$('#apLic').value}),
  perAdj:d=>{const g=cur();const p=Math.max(1,g.period+(+d.d));if(p===g.period)return;g.running=false;g.period=p;g.clock=perLen(g,p);save();closeModal();render();toast(`Periodo impostato: ${perLabel(p)}`);},
  forceEnd:()=>{const g=cur();ask('Terminare la gara ora?','La gara verrà segnata come terminata con il punteggio attuale.','Termina',()=>{g.running=false;g.status='finished';g.endedAt=Date.now();save();view.sheetId=g.id;view.sheetFrom='live';go('sheet');},true);},
  reopen:()=>{const g=cur();g.status='live';save();closeModal();render();toast('Gara riaperta');},
  fullscreen:()=>{closeModal();const el=document.documentElement;try{if(document.fullscreenElement)document.exitFullscreen();else (el.requestFullscreen||el.webkitRequestFullscreen).call(el);}catch(e){}},

  /* archive / sheet */
  sheet:d=>{view.sheetFrom=view.screen;view.sheetId=d.id;go('sheet');},
  sheetBack:()=>go(view.sheetFrom==='live'&&cur()&&cur().id===view.sheetId?'live':'archive'),
  print:()=>window.print(),
  delGame:d=>{const g=DB.games.find(x=>x.id===d.id);ask('Eliminare la gara?',`${esc(g.teams[0].name)} – ${esc(g.teams[1].name)} del ${fmtDate(g.info.date)}. L’operazione non è reversibile (salvo backup).`,'Elimina',()=>{DB.games=DB.games.filter(x=>x.id!==d.id);if(DB.currentId===d.id)DB.currentId=null;save();render();},true);},
  exportGame:d=>{const g=DB.games.find(x=>x.id===d.id);download(`gara_${g.info.date}_${g.teams[0].name}_${g.teams[1].name}.json`.replace(/[^\w.\-]+/g,'_'),JSON.stringify({teams:[],games:[g]},null,1));},
  exportAll:()=>download(`referto_backup_${today()}.json`,JSON.stringify(DB,null,1)),
  importAll:()=>$('#importFile').click(),
  install:async()=>{if(!installPrompt)return;installPrompt.prompt();try{await installPrompt.userChoice;}catch(e){}installPrompt=null;render();},
  reload:()=>location.reload(),
};

/* =================== PWA =================== */
let installPrompt=null;
function isStandalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;if(view.screen==='home')render();});
window.addEventListener('appinstalled',()=>{installPrompt=null;toast('App installata');if(view.screen==='home')render();});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{
        if(w.state==='installed'&&navigator.serviceWorker.controller&&view.screen!=='live')
          openModal(`<h3>Aggiornamento disponibile</h3><div class="mut">È disponibile una nuova versione dell'app. I dati salvati non vengono toccati.</div><div class="mbtns"><button class="ghost" data-a="closeModal">Più tardi</button><button class="pri" data-a="reload">Aggiorna ora</button></div>`);
      });});
    }).catch(()=>{});
  });
}
// chiede al browser di non cancellare i dati locali in caso di spazio scarso
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}

/* =================== EVENTS =================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el||el.disabled) return;
  const fn=ACT[el.dataset.a]; if(fn) fn(el.dataset,el,e);
});
function bindRoot(){return view.screen==='setup'?{draft:DB.draft}:view;}
document.addEventListener('input',e=>{
  const el=e.target; if(!el.dataset||!el.dataset.b||el.type==='checkbox'||el.type==='radio') return;
  setPath(bindRoot(),el.dataset.b,el.value); if(view.screen==='setup') save();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.b&&el.type==='checkbox'){setPath(bindRoot(),el.dataset.b,el.checked);if(view.screen==='setup')save();if(el.dataset.rr)render();return;}
  if(el.dataset.c==='cap'){const t=DB.draft.teams[+el.dataset.t];t.players.forEach((p,i)=>p.captain=i===+el.dataset.i);save();return;}
  if(el.dataset.c==='loadTeam'&&el.value){const src=DB.teams.find(x=>x.id===el.value);const t=DB.draft.teams[+el.dataset.t];
    t.name=src.name;t.coach=src.coach||'';t.coachLic=src.coachLic||'';t.assistant=src.assistant||'';
    const many=src.players.length>12;
    t.players=src.players.slice().sort(numSort).map(p=>({num:p.num,last:p.last,first:p.first,lic:p.lic,sel:!many,starter:false,captain:false}));
    save();render();if(many)toast(`${src.players.length} giocatori: seleziona i 12 a referto`);}
});
document.addEventListener('pointerdown',e=>{if(e.target.closest('[data-siren]')){e.preventDefault();sirenStart();}});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>sirenStop()));
document.addEventListener('pointerleave',e=>{if(e.target.closest&&e.target.closest('[data-siren]'))sirenStop();},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-siren]'))e.preventDefault();});
document.addEventListener('keyup',e=>{if(e.code==='KeyS')sirenStop();});
window.addEventListener('blur',()=>sirenStop());
document.addEventListener('keydown',e=>{
  if(view.screen==='live'&&!$('#modal').innerHTML&&e.code==='KeyS'&&e.target.tagName!=='INPUT'){if(!e.repeat)sirenStart();return;}
  if(view.screen!=='live'||$('#modal').innerHTML) { if(e.key==='Enter'&&$('#clkIn'))ACT.clkSet(); if(e.key==='Escape')closeModal(); return; }
  if(e.target.tagName==='INPUT') return;
  // Spazio o Invio (anche Invio del tastierino numerico bluetooth): avvia/ferma il cronometro
  if(e.code==='Space'||e.key==='Enter'||e.code==='NumpadEnter'){
    e.preventDefault(); // evita che Invio "clicchi" il pulsante toccato per ultimo
    if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();
    if(!e.repeat)clockToggle();
  }
});
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.teams)||!Array.isArray(d.games))throw 0;
    let nt=0,ng=0;
    d.teams.forEach(t=>{if(!DB.teams.some(x=>x.id===t.id)){DB.teams.push(t);nt++;}});
    d.games.forEach(g=>{g.running=false;if(!DB.games.some(x=>x.id===g.id)){DB.games.push(g);ng++;}});
    DB.games.sort((a,b)=>(b.created||0)-(a.created||0));save();render();toast(`Importate ${nt} squadre e ${ng} gare`);
  }catch(err){toast('File non valido',true);} e.target.value='';};
  r.readAsText(f);
});
window.addEventListener('beforeunload',()=>save());

render();
</script>
</body>
</html>
